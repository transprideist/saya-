<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayaç</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <!-- 1. DİL SEÇİM EKRANI (Başlangıçta sadece bu görünür) -->
    <div id="langSelectScreen" class="lang-select-screen">
        <div class="lang-dots">
            <a href="#tr">TR</a>
            <span>•</span>
            <a href="#en">EN</a>
            <span>•</span>
            <a href="#ku">KU</a>
            <span>•</span>
            <a href="#ar">AR</a>
        </div>
    </div>

    <!-- 2. SAYAÇ EKRANI (Dil seçilince hash ile bu açılır) -->
    <div id="counterScreen" class="counter-screen" style="display: none;">
        <div class="lang-nav">
            <a href="#tr">TR</a>
            <span>•</span>
            <a href="#en">EN</a>
            <span>•</span>
            <a href="#ku">KU</a>
            <span>•</span>
            <a href="#ar">AR</a>
        </div>
        <div class="container">
            <div id="tarih">Yükleniyor..</div>
            <div id="subheader" class="subheader"></div>
            <button id="shareBtn" class="share-btn" aria-label="Paylaş">
                <i id="shareIcon" class="fa-solid fa-share-nodes"></i>
            </button>
        </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
